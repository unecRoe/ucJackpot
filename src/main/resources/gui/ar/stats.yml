title: '<#ffaa00><bold>الإحصائيات</bold> <dark_gray>| <white>%jackpot_name%</white>'
size: 27
filler:
  material: ORANGE_STAINED_GLASS_PANE
  name: ' '
items:
  player:
    slot: 11
    material: PLAYER_HEAD
    head: '%player%'
    name: '<#ffaa00><bold>%player%</bold>'
    lore:
      - '<dark_gray>معلوماتك في الجولة'
      - ''
      - '<#ffcc33>الدخول <dark_gray>| <white>%player_entries%</white>'
      - '<#cc99ff>الفرصة <dark_gray>| <white>%player_chance%%</white>'
      - '<#55ff99>الرصيد الكلي <dark_gray>| <white>%pot_value%</white>'
