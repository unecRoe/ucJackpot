  round:
    slot: 13
    material: CLOCK
    name: '<#ffcc33><bold>حالة الجولة</bold>'
    lore:
      - '<dark_gray>الحالة الحالية'
      - ''
      - '<#ffcc33>الحالة <dark_gray>| <white>%status%</white>'
      - '<#cc99ff>الوقت المتبقي <dark_gray>| <white>%time_left%</white>'
