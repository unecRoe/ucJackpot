title: '<#ffaa00><bold>Statistik</bold> <dark_gray>| <white>%jackpot_name%</white>'
size: 27
filler:
  material: ORANGE_STAINED_GLASS_PANE
  name: ' '
items:
  player:
    slot: 11
    material: PLAYER_HEAD
    head: '%player%'
    name: '<#ffaa00><bold>%player%</bold>'
    lore:
      - '<dark_gray>Deine Rundendaten'
      - ''
      - '<#ffcc33>Einträge <dark_gray>| <white>%player_entries%</white>'
      - '<#cc99ff>Chance <dark_gray>| <white>%player_chance%%</white>'
      - '<#55ff99>Gesamtpool <dark_gray>| <white>%pot_value%</white>'
    action: none
  round:
    slot: 13
    material: CLOCK
    name: '<#ffcc33><bold>Rundenstatus</bold>'
    lore:
      - '<dark_gray>Aktueller Stand'
      - ''
      - '<#ffcc33>Status <dark_gray>| <white>%status%</white>'
      - '<#cc99ff>Zeit übrig <dark_gray>| <white>%time_left%</white>'
      - '<#ffaa00>Teilnehmer <dark_gray>| <white>%players%</white>'
    action: none
  back:
    slot: 15
    material: ARROW
    name: '<#55ff99><bold>Zurück</bold>'
    lore:
      - '<gray>Zurück zum Hauptmenü.'
    action: open-main
sounds:
  open: BLOCK_NOTE_BLOCK_PLING
  click: UI_BUTTON_CLICK
  error: ENTITY_VILLAGER_NO




