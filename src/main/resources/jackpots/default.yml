# ucJackpot room configuration: General Room
#
# This is the default hybrid room. Players can enter with money, accepted
# items, or jackpot tickets. Every value in this file affects only this room.

# Unique room id used by commands, storage, logs, placeholders, and GUI actions.
id: default

# Set false to keep this room loaded in config but unavailable in-game.
enabled: true

# Display name used when no GUI locale override is available.
# MiniMessage colors are supported.
display-name: '<gradient:#ffcc33:#ff3366>General Room</gradient>'

# Room mode:
# money  = money entries only
# item   = item entries only
# hybrid = money + item entries
mode: hybrid

currency:
  # Enables money entries for this room. Requires Vault and an economy plugin.
  enabled: true

  # Lowest money amount a player can deposit in one entry.
  min-entry: 100.0

  # Highest money amount a player can deposit in one entry.
  max-entry: 1000000.0

  # Default money amount used by quick join and command joins without amount.
  default-entry: 1000.0

  # Quick amount buttons shown in the money GUI.
  quick-amounts: [100.0, 1000.0, 5000.0, 10000.0, 50000.0]

  # Percent removed from money prize before payout. Use 0.0 for no tax.
  tax-percent: 0.0

items:
  # Enables item entries for this room.
  enabled: true

  # Minimum total item value required for one item entry.
  min-value: 50.0

  # Minimum item stacks a player must select before confirming.
  min-items-per-entry: 1

  # Maximum item stacks a player can select in one entry.
  max-items-per-entry: 9

  # Adds a second confirmation for named, enchanted, lore, model-data,
  # shulker-like, or otherwise special-looking items.
  special-protection: true

  # Whether enchanted items are accepted by this room.
  accept-enchanted-items: true

  # Whether items with custom model data are accepted by this room.
  accept-custom-model-data: true

  # Material values are used as item entry weight.
  # Use Bukkit material names in uppercase.
  material-values:
    DIAMOND: 250.0
    EMERALD: 200.0
    NETHERITE_INGOT: 1500.0
    GOLD_INGOT: 75.0
    IRON_INGOT: 25.0

round:
  # Round length after the countdown starts.
  duration-seconds: 300

  # Countdown starts only when this many unique players have joined.
  min-players: 2

  # Minimum total pot value required before the room can draw.
  min-total-value: 100.0

  # Maximum entries a single player can make in this round.
  max-entries-per-player: 25

  # Delay between entries for the same player.
  cooldown-seconds: 10

  # Automatically draw when time reaches zero and requirements are met.
  auto-draw: true

  # Grace delay before the active countdown begins after requirements are met.
  start-delay-seconds: 10

odds:
  luck-streak-dampener:
    # Reduces the weight of recent winners to make repeated wins less likely.
    enabled: true

    # How far back recent wins are considered.
    recent-win-window-hours: 24

    # Weight multiplier applied to players who recently won.
    multiplier-after-win: 0.75

engagement:
  combo:
    # Adds a small bonus for repeated participation in the same round.
    enabled: true

    # Bonus percent added per qualifying combo step.
    step-percent: 1.0

    # Maximum total combo bonus percent.
    max-percent: 5.0

season:
  # Season id used for this room's seasonal statistics and rewards.
  id: season-1

  # Console commands executed by /ucjackpot season reward.
  # Supported placeholders: %player%, %rank%, %season%, %entries%, %wins%,
  # %value_in%, %value_won%.
  reward-commands:
    - 'say %player% received season %season% reward. Rank #%rank%'

tickets:
  # Enables ticket entries for this room.
  enabled: true

  # Material used by admin ticket give command.
  material: PAPER

  # Ticket display-name text that must be present for player ticket entries.
  name-contains: Jackpot Ticket

  # Entry weight added when a player uses one ticket.
  entry-value: 1000.0

rewards:
  # If true, item deposits are delivered to the winner as real items.
  winner-takes-items: true

  consolation:
    # Enables small consolation rewards for eligible non-winners.
    enabled: true

    # Minimum entries required before consolation rewards can run.
    min-entries: 3

    # Money percent used for consolation reward calculation.
    money-percent: 1.5

    # Console commands for consolation rewards.
    commands:
      - 'say %player% received a jackpot consolation reward.'

  rare-bonus:
    # Enables rare bonus command rolls after a draw.
    enabled: true

    # Chance percent for the rare bonus.
    chance-percent: 2.0

    # Console commands executed when rare bonus triggers.
    commands:
      - 'say %player% triggered a jackpot lucky bonus.'

broadcasts:
  # Pot values that trigger milestone broadcasts.
  milestone-values: [1000.0, 10000.0, 100000.0]

  # Remaining seconds that trigger countdown broadcasts.
  countdown-seconds: [60, 30, 10, 5, 4, 3, 2, 1]
